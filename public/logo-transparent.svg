<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- GFK Holidays Official Transparent Luxury Travel Mark -->
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Elegant Orbital Latitude Rings -->
  <ellipse cx="256" cy="256" rx="220" ry="110" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="14 10" transform="rotate(-28 256 256)" opacity="0.85" />
  <ellipse cx="256" cy="256" rx="200" ry="90" stroke="url(#goldGrad)" stroke-width="6" transform="rotate(35 256 256)" opacity="0.9" />

  <!-- Central Dynamic Compass & Globe Sphere -->
  <circle cx="256" cy="256" r="140" fill="url(#emeraldGrad)" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="132" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" fill="none" />
  
  <!-- Globe Meridians and Parallels -->
  <path d="M 126 256 Q 256 160 386 256" stroke="#ffffff" stroke-width="3" stroke-opacity="0.45" fill="none" />
  <path d="M 126 256 Q 256 352 386 256" stroke="#ffffff" stroke-width="3" stroke-opacity="0.45" fill="none" />
  <ellipse cx="256" cy="256" rx="60" ry="132" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.45" fill="none" />
  <line x1="116" y1="256" x2="396" y2="256" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" />
  <line x1="256" y1="116" x2="256" y2="396" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" />

  <!-- Tropical Island Silhouette & Waves Inside Sphere -->
  <path d="M 180 300 Q 220 280 256 295 Q 290 310 332 292 L 332 320 Q 256 335 180 320 Z" fill="#064e3b" opacity="0.6" />
  <path d="M 195 285 Q 215 250 230 260 Q 245 270 260 250 Q 275 270 290 262 Q 310 285 320 288" stroke="url(#goldGrad)" stroke-width="4" fill="none" />

  <!-- Compass Star North-East-South-West -->
  <polygon points="256,120 268,244 392,256 268,268 256,392 244,268 120,256 244,244" fill="url(#goldGrad)" opacity="0.95" />
  <polygon points="256,140 264,248 372,256 264,264 256,372 248,264 140,256 248,248" fill="#ffffff" opacity="0.6" />

  <!-- Majestic Supersonic Flight Arc Wrapping the Globe -->
  <path d="M 70 380 Q 180 100 440 140" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" fill="none" />
  <path d="M 70 380 Q 180 100 440 140" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 12" fill="none" />

  <!-- Aircraft Silhouette at Tip of Arc -->
  <g transform="translate(438, 140) rotate(52) scale(1.4)">
    <polygon points="0,-18 14,14 0,8 -14,14" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#ffffff" />
  </g>

  <!-- Central Star Sparkle -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  <circle cx="256" cy="256" r="8" fill="#fbbf24" />
</svg>
